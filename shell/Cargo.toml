[package]
name = "noros-shell"
description = "NorOS desktop shell: wallpaper, menu bar, dock, launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
lys = { path = "../crates/lys", features = ["gsettings"] }
vakt = { path = "../crates/vakt" }
