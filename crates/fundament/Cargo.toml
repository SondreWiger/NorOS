[package]
name = "fundament"
description = "NorOS installer and update/rollback backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[[bin]]
name = "noros-install"
path = "src/bin/noros-install.rs"

[[bin]]
name = "noros-update"
path = "src/bin/noros-update.rs"
