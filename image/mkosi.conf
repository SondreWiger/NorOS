# NorOS system image (Debian 13 base, invisible to the user).

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
ImageId=noros
Format=disk
OutputDirectory=../out
CacheDirectory=../.ci-cache/mkosi
# The root partition and kernel are also written out separately; ci/make-iso.sh
# turns them into the live ISO.
SplitArtifacts=uki,kernel,initrd,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=rw quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3
Hostname=noros
Locale=C.UTF-8
Timezone=Europe/Oslo
WithDocs=no
# The live ISO boots from CD/USB, so its drivers must be in the initrd.
KernelModulesInitrdInclude=default
        isofs
        sr_mod
        cdrom
        overlay
        virtio_scsi
        usb-storage
        uas

# Core system, graphics/input (Mesa includes software rendering for VMs),
# GTK with icons and fonts, and the apps bundled in 0.1.
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        udev
        dbus
        dbus-user-session
        libpam-systemd
        libnss-systemd
        polkitd
        sudo
        passwd
        kbd
        procps
        iproute2
        less
        nano
        ca-certificates
        libgl1-mesa-dri
        libegl1
        libgles2
        libgbm1
        libinput10
        libinput-bin
        libseat1
        libxkbcommon0
        xkb-data
        libgtk-4-1
        libgtk4-layer-shell0
        librsvg2-common
        gsettings-desktop-schemas
        shared-mime-info
        adwaita-icon-theme
        hicolor-icon-theme
        fonts-inter
        fonts-dejavu-core
        foot
        foot-terminfo
