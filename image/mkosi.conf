# NorOS system image (Debian 13 base, invisible to the user).

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
ImageId=noros
Format=disk
OutputDirectory=../out
# The kernel and initrd are also written out separately for the live ISO.
SplitArtifacts=kernel,initrd

[Build]
CacheDirectory=../.ci-cache/mkosi

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=rw quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3
Hostname=noros
Locale=C.UTF-8
Timezone=Europe/Oslo
WithDocs=no
# The initrd carries what's needed to find and mount the root filesystem (including
# from the live ISO), plus a screen and keyboard for typing the disk password.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
        isofs
        sr_mod
        cdrom
        overlay
        virtio_scsi
        virtio_blk
        virtio_pci
        ahci
        nvme
        sd_mod
        xhci_pci
        ehci_pci
        usb-storage
        uas
        dm-crypt
        dm-mod
        btrfs
        xor
        raid6_pq
        /crypto/
        usbhid
        hid-generic
        hid-apple
        hid-microsoft
        hid-logitech
        i8042
        atkbd
        virtio_input
        virtio-gpu
        simpledrm

# Core system, graphics/input (Mesa includes software rendering for VMs),
# GTK with icons and fonts, and the apps bundled in 0.1.
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        udev
        dbus
        dbus-user-session
        libpam-systemd
        libnss-systemd
        polkitd
        sudo
        passwd
        kbd
        procps
        iproute2
        less
        nano
        ca-certificates
        libgl1-mesa-dri
        libegl1
        libgles2
        libgbm1
        libinput10
        libinput-bin
        libseat1
        libxkbcommon0
        xkb-data
        libgtk-4-1
        libgtk4-layer-shell0
        librsvg2-common
        gsettings-desktop-schemas
        dconf-gsettings-backend
        dconf-service
        libglib2.0-bin
        shared-mime-info
        adwaita-icon-theme
        hicolor-icon-theme
        fonts-inter
        fonts-dejavu-core
        cryptsetup
        systemd-cryptsetup
        btrfs-progs
        dosfstools
        fdisk
        rsync
        foot
        foot-terminfo
