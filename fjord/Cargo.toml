[package]
name = "fjord"
description = "The NorOS compositor and window manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"
smithay-drm-extras = { workspace = true }

[dependencies.smithay]
workspace = true
default-features = false
features = [
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
]
